# descriptive: find it and understand it
id: blue-diamond-leaf-stencil-band
title: Blue stencil band with three-leaf sprigs
description: One horizontal repeat of a stencilled band in bright royal blue on the untouched white graph-paper sheet. A wavy stem throws off two curling S-scrolls, each carrying a sprig of three leaves with a pointed central one, the sprigs pointing alternately up and down; a straight stencil-cut rule with bridge gaps runs along the top and bottom edges. The left and right edges join seamlessly. The ground is opaque, with the sheet's grey grid visible.
