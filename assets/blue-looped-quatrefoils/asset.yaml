# descriptive: find it and understand it
id: blue-looped-quatrefoils
title: Blue looped quatrefoil
description: A single quatrefoil in flat mid blue on an opaque pale blue ground. Four pointed oval loops meet at the centre, each holding a trefoil bud on a pointed leaf, with a small three-lobed sprig in each diagonal gap. The motif is symmetric about both axes and its edges join when the piece is repeated, but it is about as tall as it is wide. Not transparent.
type: border
