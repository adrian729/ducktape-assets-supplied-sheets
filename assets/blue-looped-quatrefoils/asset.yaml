    description: Top-left corner, the same quatrefoil on a square of pale blue, so the frame reads as a run of quatrefoils around all four sides.
usage_notes:
  - The repeat is about as long as it is thick, so it is not declared as a tile; repeat it with background-repeat in either direction, or use the frame atlas.
  - Also works alone as a small square ornament.
  - The frame atlas composes one repeat with the corner component; use it with border-image and round fitting.
