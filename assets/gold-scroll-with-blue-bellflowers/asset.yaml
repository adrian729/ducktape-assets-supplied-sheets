title: Gold acanthus scroll with blue bellflowers
description: A horizontal flourish drawn in flat gold with black outlines on an opaque white ground. A long S-curved acanthus stem with curling leaf ends at both sides throws off five blue and white bellflowers on short stalks, two hanging below the stem and three standing above it. A thin black rule runs along the top edge. Not transparent.
