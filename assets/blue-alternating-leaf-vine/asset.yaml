# descriptive: find it and understand it
id: blue-alternating-leaf-vine
title: Blue vine with alternating lobed leaves
description: One vertical repeat of a vine in flat mid blue on an opaque pale blue ground. A thin stem loops into two rounded coils, each enclosing a large five-lobed leaf, the leaves pointing alternately up to the right and down to the left, with small three-leaf clusters on short tendrils in the gaps. The top and bottom edges join seamlessly when stacked. Not transparent.
type: border
categories:
