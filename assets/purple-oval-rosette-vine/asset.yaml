id: purple-oval-rosette-vine
title: Purple oval scroll and rosette border
description: One vertical repeat of a narrow border in dark purple on an opaque pale blue ground. A tall pointed oval of mirrored stems with inward curls and leaf tips alternates with a small round rosette of lobed petals around a pierced oval centre. The top and bottom edges join seamlessly when stacked. Not transparent.
