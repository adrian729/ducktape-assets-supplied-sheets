# descriptive: find it and understand it
id: floral-bird-panel-left
title: Gold panel of flowers and finches, first copy
description: A tall narrow panel on a mottled gold ground inside a dark brown ruled border that ends in a cusped arch with a scroll finial and a small pink knob at both ends. From the top it holds a snail on a leaf, a red rose, a blue star-shaped flower, a brown butterfly, a purple pansy, a fly, a goldfinch facing right, a pink flower, a speckled butterfly, a strawberry with white blossoms, a red-breasted finch facing right, violets, a round leaf, a brown butterfly and a blue iris. The sheet outside the panel is transparent.
