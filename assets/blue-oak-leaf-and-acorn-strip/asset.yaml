id: blue-oak-leaf-and-acorn-strip
title: Blue oak leaf and acorn strip
description: A narrow vertical strip of four clusters of lobed oak-like leaves with cross-hatched acorns, in flat mid blue on an opaque pale blue ground. The two upper clusters sweep one way and the two lower ones are the same pair turned 180 degrees, so the strip reads the same from either end; leaf tips and acorns reach the strip's edges. The ends do not join as a repeat. Not transparent.
