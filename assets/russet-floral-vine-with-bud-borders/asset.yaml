# descriptive: find it and understand it
id: russet-floral-vine-with-bud-borders
title: Russet floral vine with bud side bands
description: One vertical repeat of a wide painted border. The centre band, on an opaque russet ground, carries a sage-green vine with large cream and tan peony-like flowers, white daisies, pink tulip-shaped flowers and grey-green serrated leaves; on each side a narrow peach band holds a sage vine of small dark red and grey-blue buds, set off by thin dark and sage-green rules. The top and bottom edges join seamlessly when stacked. Not transparent.
