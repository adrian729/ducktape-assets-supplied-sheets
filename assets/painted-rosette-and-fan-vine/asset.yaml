# descriptive: find it and understand it
id: painted-rosette-and-fan-vine
title: Painted vine with tulip, rosette and carnation on ochre
description: One horizontal repeat of a painted border on an opaque ochre ground between thin red rules. Along an undulating olive vine with narrow leaves stand, from the left, a red tulip-shaped bud, a round flower of cream petals around a red and teal centre, a red fan-shaped carnation with a teal calyx, and a star rosette of teal and red rays around a cream centre. The left and right edges join seamlessly. Flat colour with fine brown contours; not transparent.
