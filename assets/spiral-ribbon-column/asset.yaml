# descriptive: find it and understand it
id: spiral-ribbon-column
title: Spiral ribbon column
description: A tall slender column on a mottled gold ground wrapped from top to bottom in two spiralling ribbons, one plain blue and one red striped with white, with tiny green flowering sprigs painted in the gold spaces between the turns. At the top a plume of green leaves, white curling acanthus and a red-brown flower spike rises from the last turn; the bottom ends on the lowest turn of ribbon. The sheet around the column is transparent.
