# descriptive: find it and understand it
id: floral-bird-panel-blue
title: Gold panel of roses and blue birds with blue finials
description: A tall narrow panel on a mottled gold ground inside a dark brown ruled border. From the top it holds a white rose with a small fly, an orange and black butterfly, a pink rose with a bud, a blue bird clinging head downward to a stem, a second pink rose, a purple butterfly, a yellow rose, a second blue bird head downward on a crimson rose, and a dark beetle, all on thin green stems. At each end a bright blue acanthus finial with a gold leaf cap grows from the border. The sheet outside the panel is transparent.
