# descriptive: find it and understand it
id: painted-opposed-serrated-flower-vine
title: Painted vine with serrated flowers on ochre
description: One horizontal repeat of a painted border on an opaque ochre ground between thin red rules. An olive stem with spiky teal and olive leaves carries two large flowers, each a red bud wrapped in cream serrated petals, one leaning left and one right, with small cream and red buds and teal leaf sprays between them. The left and right edges join seamlessly. Flat colour with fine brown contours; not transparent.
