# descriptive: find it and understand it
id: painted-symmetric-leaf-and-flower-panel
title: Painted mirrored leaf panel with square trim
description: A broad horizontal painted panel on an opaque yellow ground. Along the top, under a gold rule, hangs a row of alternating olive and red-brown squares; below it pairs of long tan lanceolate leaves curve outward from red stems in a mirrored pattern, with round flowers of teal petals and red centres on short stalks, clusters of small berries, and a tan palmette at the centre of each pair. The ends are cut and do not repeat. Flat colour with fine brown contours; not transparent.
