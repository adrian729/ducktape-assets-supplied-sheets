# descriptive: find it and understand it
id: blue-alternating-stencil-scroll
title: Blue stencil scroll with alternating leaves
description: One horizontal repeat of a stencilled scroll in bright royal blue on the untouched white sheet, whose grey graph-paper grid shows through. Two S-curved stems with round bud-like ends carry curving acanthus leaf tips and small teardrop leaves, the second curl being the first turned over; the stencil bridges leave every shape as a separate cut piece. The left and right edges join seamlessly. The ground is opaque.
