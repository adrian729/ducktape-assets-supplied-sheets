# descriptive: find it and understand it
id: painted-sprawling-floral-panel
title: Painted scrolling floral panel on yellow
description: A broad horizontal painted panel on an opaque yellow ground with a thin red rule along the top and bottom edges. Tan scrolling stems with spiky serrated leaves sprawl across the whole width, carrying flowers of several kinds, a large pink and teal flower, a round red and teal rosette, small blue flowers with red centres, cream buds and olive leaves. The stems are cut at both ends and there is no repeat. Flat colour with fine brown contours; not transparent.
