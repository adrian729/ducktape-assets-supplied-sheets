# descriptive: find it and understand it
id: blue-bird-and-fan-scroll-border
title: Blue border with wading bird, fan and palmette
description: One repeat of a border in flat mid blue on an opaque pale blue ground. Two heart-shaped scroll loops rise side by side, the left one enclosing a serrated fan on a curled stem and the right one a long-necked wading bird standing on a leaf and facing right; a fan-shaped palmette fills the gap between them below, with small leaf sprigs along the bottom edge. The left and right edges join when repeated, but the repeat is barely wider than it is tall. Not transparent.
type: border
