# descriptive: find it and understand it
id: blue-staggered-leaf-scrolls
title: Blue scroll border with small leaves
description: One repeat of a vertical border in flat mid blue on an opaque pale blue ground. C-scrolls with dotted terminals are stacked in two staggered columns along a central stem, and each throws off small pointed leaves and a fan of serrated leaves so that the leaves of one column point into the gaps of the other. The top and bottom edges join when stacked, but the repeat is about as tall as it is wide. Not transparent.
type: border
categories:
  - botanical
  - scrollwork
subjects:
  - scroll
  - leaf
  - stem
colors:
  - blue
  - light-blue
facing: none
composition: repeat-tile

