# descriptive: find it and understand it
id: russet-opposed-flowers-and-sage-leaves
title: Russet floral vine, centre band
description: One vertical repeat of the centre band of the russet floral border on its own. On an opaque russet ground a sage-green vine carries two large flowers of cream and tan petals facing opposite ways, white daisies on thin stems, pink tulip-shaped flowers and grey-green serrated leaves with white veins, bounded on each side by a thin sage-green rule and a dark rule. The top and bottom edges join seamlessly when stacked. Not transparent.
