# descriptive: find it and understand it
id: olive-leaf-and-red-berry-vine
title: Olive leaf and red berry vine
description: One horizontal repeat of a vine drawn in flat colour with black outlines on an opaque white ground. A thin black stem undulates along the strip carrying olive-green leaves with darker shading, a large leaf curling up at the left and smaller ones below, and a single red berry hanging on a forked stalk at the right. A thin black rule runs along the top edge. The left and right edges join seamlessly. Not transparent.
