# descriptive: find it and understand it
id: sage-leaf-and-russet-bud-vine
title: Sage vine with russet and grey buds
description: One vertical repeat of the narrow bud band from the russet floral border. On an opaque peach ground a sage-green stem with pale leaves winds up the strip, carrying at every turn a three-petalled bud whose petals are dark red and grey-blue, the buds pointing alternately left and right, between a dark rule and a sage-green rule on each side. The top and bottom edges join seamlessly when stacked. Not transparent.
