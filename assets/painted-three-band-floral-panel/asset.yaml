# descriptive: find it and understand it
id: painted-three-band-floral-panel
title: Painted three-band panel with carnations
description: A broad horizontal painted panel of three stacked bands separated by thin gold rules. The narrow top and bottom bands, on an opaque dark red ground, carry interlacing tan and teal straps with small red and cream flowers; the wider middle band, on a yellow ground, carries a tan strapwork vine with olive leaves, red fan-shaped carnations and a tan palmette at the centre. The ends are cut and do not repeat. Flat colour with fine brown contours; not transparent.
