# descriptive: find it and understand it
id: purple-opposed-scroll-vine
title: Purple vine with opposed scroll loops
description: One vertical repeat of a vine in dark purple on an opaque pale blue ground. A thin stem bends into a large loop that encloses two opposed inner curls, each tipped with pointed leaf blades and small split leaves, and the whole turns over at each half repeat so that successive loops face alternate ways. The top and bottom edges join seamlessly when stacked. Not transparent.
